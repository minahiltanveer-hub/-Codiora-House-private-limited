<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link rel="stylesheet" href="css/contact.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<body>

<header>

<h1>Student Performance Analytics Portal</h1>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="report.html">Reports</a>

<a href="contact.html" class="active">Contact</a>

</nav>

</header>

<section class="contact-container">

<div class="contact-info">

<h2>Get In Touch</h2>

<p><i class="fa-solid fa-envelope"></i> support@studentportal.com</p>

<p><i class="fa-solid fa-phone"></i> +92 300 1234567</p>

<p><i class="fa-solid fa-location-dot"></i> Lahore, Pakistan</p>

</div>

<div class="contact-form">

<form id="contactForm">

<input type="text" id="name" placeholder="Your Name" required>

<input type="email" id="email" placeholder="Your Email" required>

<textarea id="message" rows="6" placeholder="Write your message..." required></textarea>

<button type="submit">Send Message</button>

<p id="successMessage"></p>

</form>

</div>

</section>

<script src="js/contact.js"></script>

</body>

</html>
