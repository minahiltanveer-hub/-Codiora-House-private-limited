<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Student Performance Analytics Portal</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<body>

<header>

    <h1>Student Performance Analytics Portal</h1>

    <a href="index.html" class="logout-btn">
        Logout
    </a>

</header>

<section class="dashboard">

    <div class="card">

        <i class="fa-solid fa-user-graduate"></i>

        <h2 id="students">0</h2>

        <p>Total Students</p>

    </div>

    <div class="card">

        <i class="fa-solid fa-chart-line"></i>

        <h2 id="average">0%</h2>

        <p>Average Marks</p>

    </div>

    <div class="card">

        <i class="fa-solid fa-award"></i>

        <h2 id="topper">0</h2>

        <p>Top Score</p>

    </div>

    <div class="card">

        <i class="fa-solid fa-circle-check"></i>

        <h2 id="pass">0%</h2>

        <p>Pass Percentage</p>

    </div>

</section>

<section class="table-section">

<h2>Recent Student Records</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Course</th>

<th>Marks</th>

<th>Status</th>

</tr>

</thead>

<tbody>

<tr>

<td>Ali</td>

<td>Web Development</td>

<td>92</td>

<td>Pass</td>

</tr>

<tr>

<td>Ahmed</td>

<td>Python</td>

<td>88</td>

<td>Pass</td>

</tr>

<tr>

<td>Sara</td>

<td>AI</td>

<td>95</td>

<td>Pass</td>

</tr>

<tr>

<td>Ayesha</td>

<td>Data Science</td>

<td>79</td>

<td>Pass</td>

</tr>

</tbody>

</table>

</section>

<script src="js/dashboard.js"></script>
<script src="js/apps.js"></script>

</body>

</html>
